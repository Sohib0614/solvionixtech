<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="canonical" href="https://solvionix.com/" />

    <!-- Modern Typography: Plus Jakarta Sans for elite tech display -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap"
      rel="stylesheet"
    />

    <!-- Applied before first paint so the page never flashes the wrong theme.
         Kept in sync with src/lib/useTheme.js by the shared storage key. -->
    <script>
      ;(function () {
        try {
          var stored = window.localStorage.getItem('solvionix-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch (error) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>

    <title>Solvionix — Websites, Software, AI &amp; Automation</title>
    <meta
      name="description"
      content="Solvionix builds websites, custom software, mobile apps, AI tools and automation for businesses."
    />
    <meta name="theme-color" content="#05060a" />
    <meta name="color-scheme" content="dark light" />
    <meta name="author" content="Solvionix" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->

      property="og:description"

    <meta property="og:url" content="https://solvionix.com/" />
